[project]
name = "crewai-rag-system"
version = "0.1.0"
description = "CrewAI Flow를 활용한 PDF 기반 RAG 채팅 시스템"
authors = [
    {name = "Developer", email = "dev@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # CrewAI 관련
    "crewai[tools]>=0.80.0",
    "crewai-tools>=0.12.1",
    
    # AI/ML 관련
    "langchain-google-genai>=2.1.12",  # Gemini 지원
    "chromadb>=0.5.15",
    
    # PDF 처리
    "PyPDF2>=3.0.1",
    "pymupdf>=1.24.12",
    "markdown>=3.7",
    
    # 유틸리티
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "rich>=13.9.4",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "black>=24.10.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "utils", "flows", "config"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"